# .pages.yml — Pages CMS config for this site (Astro content collections)

media:
  name: images
  label: Images
  input: src/images
  output: src/images
  path: "" # start at src/images
  extensions: [png, jpg, jpeg, webp, svg]

settings:
  content:
    merge: true

content:
  # ---------------------
  # INFO PAGES
  # ---------------------
  - name: infopages
    label: Info Pages
    type: collection
    path: src/content/infopages
    filename: "{primary}.md"
    view:
      primary: page
      fields: [page, pubDate]
      sort: [page]
    fields:
      - name: page
        label: Page
        type: string
        required: true
      - name: pubDate
        label: Publication Date
        type: date
      - name: body
        label: Body
        type: rich-text

  # ---------------------
  # BLOG POSTS
  # ---------------------
  - name: posts
    label: Blog Posts
    type: collection
    path: src/content/posts
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, pubDate]
      sort: [pubDate]
      default: { sort: pubDate, order: desc }
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: pubDate
        label: Publication Date
        type: date
      - name: description
        label: Description
        type: text
      - name: team
        label: Author
        type: string
      - name: image
        label: Cover Image
        type: object
        fields:
          - name: url
            label: Image
            type: image
            options:
              media: images
              path: blog
          - name: alt
            label: Alt text
            type: string
      - name: tags
        label: Tags
        type: string
        list: true
      - name: body
        label: Body
        type: rich-text

  # ---------------------
  # TEAM
  # ---------------------
  - name: team
    label: Team Members
    type: collection
    path: src/content/team
    filename: "{primary}.md"
    view:
      primary: name
      fields: [name, role]
      sort: [name]
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: role
        label: Role
        type: string
      - name: bio
        label: Bio
        type: text
      - name: image
        label: Profile Image
        type: object
        fields:
          - name: url
            label: Image
            type: image
            options:
              media: images
              path: team
          - name: alt
            label: Alt text
            type: string
      - name: socials
        label: Social Links
        type: object
        fields:
          - { name: twitter,  label: Twitter URL,  type: string }
          - { name: website,  label: Website URL,  type: string }
          - { name: linkedin, label: LinkedIn URL, type: string }
          - { name: email,    label: Email,        type: string }
      - name: body
        label: Body
        type: rich-text

  # ---------------------
  # SERVICES
  # ---------------------
  - name: services
    label: Services
    type: collection
    path: src/content/services
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, category]
      sort: [title]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: summary
        label: Summary
        type: text
      - name: category
        label: Category
        type: string
        options: [Advisory, Compliance, Operations]
      - name: features
        label: Features
        type: string
        list: true
      - name: outcomes
        label: Outcomes
        type: string
        list: true
      - name: industries
        label: Industries
        type: string
        list: true
      - name: pricing
        label: Pricing
        type: object
        fields:
          - { name: startingPrice, label: Starting Price, type: string }
          - { name: monthlyPrice,  label: Monthly Price,  type: string }
          - name: pricingModel
            label: Pricing Model
            type: string
            options: [one-time, monthly, hourly, custom]
          - { name: note, label: Pricing Note, type: string }
      - name: image
        label: Service Image
        type: object
        fields:
          - name: url
            label: Image
            type: image
            options:
              media: images
              path: services
          - name: alt
            label: Alt text
            type: string
      - name: pubDate
        label: Publication Date
        type: date
      - name: updatedDate
        label: Updated Date
        type: date
      - name: body
        label: Body
        type: rich-text

  # ---------------------
  # INDUSTRIES
  # ---------------------
  - name: industries
    label: Industries
    type: collection
    path: src/content/industries
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title]
      sort: [title]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: summary
        label: Summary
        type: text
      - name: painPoints
        label: Common Challenges
        type: string
        list: true
      - name: relevantServices
        label: Relevant Services
        type: string
        list: true
      - name: image
        label: Industry Image
        type: object
        fields:
          - name: url
            label: Image
            type: image
            options:
              media: images
              path: industries
          - name: alt
            label: Alt text
            type: string
      - name: body
        label: Body
        type: rich-text

  # ---------------------
  # CASE STUDIES
  # ---------------------
  - name: caseStudies
    label: Case Studies
    type: collection
    path: src/content/caseStudies
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, client, industry, pubDate]
      sort: [pubDate]
      default: { sort: pubDate, order: desc }
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: client
        label: Client
        type: string
      - name: industry
        label: Industry
        type: string
      - name: services
        label: Services Provided
        type: string
        list: true
      - name: challenge
        label: Challenge
        type: text
      - name: solution
        label: Solution
        type: text
      - name: results
        label: Results
        type: object
        list: true
        fields:
          - { name: label, label: Metric, type: string }
          - { name: value, label: Value,  type: string }
      - name: testimonial
        label: Testimonial
        type: object
        fields:
          - { name: quote,  label: Quote,  type: text }
          - { name: author, label: Author, type: string }
          - { name: role,   label: Role,   type: string }
      - name: image
        label: Case Study Image
        type: object
        fields:
          - name: url
            label: Image
            type: image
            options:
              media: images
              path: cases
          - name: alt
            label: Alt text
            type: string
      - name: pubDate
        label: Publication Date
        type: date
      - name: body
        label: Body
        type: rich-text